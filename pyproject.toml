[project]
name = "capstone-langchain-foundry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dyn-RayanEncarnacion", email = "Rayan.Encarnacion@Dynata.com" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-cosmos>=4.16.3",
    "azure-identity>=1.25.3",
    "azure-search-documents>=12.0.0",
    "azure-storage-blob>=12.30.0",
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "langchain>=1.3.15",
    "langchain-azure-cosmosdb>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-openai>=1.5.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.3.0",
    "uvicorn[standard]>=0.52.3",
]

# Application, not a library: uv only manages the venv + deps (no build step).
[tool.uv]
package = false
